<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Javier Gutierrez</title>
  
  <!--Tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    .titulo-louboutin {
      font-family: 'Great Vibes', cursive;
      font-size: 38px;
      font-weight: normal;
      margin: 0;
      color: #f5f5f5;
      letter-spacing: 1px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background-color: #1a1a1a;
      padding: 15px 20px;
      border-bottom: 2px solid #333333;
    }

    .header-col-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-col-center {
      border-left: 2px solid #6B1D2F;
      height: 80%;
      margin: 0 20px;
    }

    .header-col-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .logo-cabecera {
      max-width: 250px;
      height: auto;
      display: block;
    }

    .logo-pequeno {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    .barra-navegacion {
      display: flex;
      gap: 15px;
      margin-top: 5px;
    }
        
    .boton-nav {
      text-decoration: none;
      color: #ffffff;
      background-color: #111111;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-family: sans-serif;
      transition: all 0.3s ease;
      border: 1px solid #333333;
    }

    .boton-nav:hover,
    .boton-nav.activo {
      background-color: #6B1D2F;
      color: #ffffff;
      font-weight: bold;
      border-color: #8c263e;
      box-shadow: 0 0 10px rgba(107, 29, 47, 0.5);
    }

    main {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    aside {
      width: 25%;
      background-color: #111111;
      padding: 15px;
      border-radius: 6px;
      box-sizing: border-box;
      border: 1px solid #222222;
    }

    section {
      width: 75%;
      background-color: #1a1a1a;
      padding: 20px;
      border-radius: 6px;
      box-sizing: border-box;
      border: 1px solid #222222;
    }

    .galeria-modelos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .tarjeta-modelo {
      background-color: #111111;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .tarjeta-modelo:hover {
      transform: translateY(-5px);
      border-color: #6B1D2F;
      box-shadow: 0 6px 15px rgba(107, 29, 47, 0.3);
    }

    .tarjeta-modelo img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }

    .tarjeta-modelo p {
      margin: 8px 0 0 0;
      font-size: 14px;
      color: #cccccc;
    }

    footer {
      background-color: #111111;
      text-align: center;
      padding: 15px;
      border-top: 1px solid #333333;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-col-left">
      <h1 class="titulo-louboutin">Bienvenue dans la boutique Lobutin.</h1>
      <nav class="barra-navegacion">
        <a href="index.html" class="boton-nav activo">Inicio</a>
        <a href="Javier -2.html" class="boton-nav">Calzado de hombre</a>
        <a href="Javier - 3.html" class="boton-nav">Calzado de mujer</a>
      </nav>
    </div>

    <div class="header-col-center"></div>

    <div class="header-col-right">
      <img src="Imagenes/christian-louboutin.svg" alt="logo de mi sitio web" class="logo-cabecera">
    </div>
  </header>

  <main>
    <aside>
      <img src="Imagenes/Louis.jpg" alt="logo de mi sitio web" class="logo-pequeno">
      <p>"El lujo no se define, se experimenta."</p>
    </aside>

    <section>
      <article>
        <h2>Sucursales</h2>

        
        <div class="galeria-modelos">
          <div class="tarjeta-modelo">
            <img src="Imagenes/sanpedro.webp" alt="Modelo 1">
            <p>Mexico San Pedro</p>
          </div>
          <div class="tarjeta-modelo">
            <img src="Imagenes/PARIS.jpg" alt="Modelo 2">
            <p>Francia Paris</p>
          </div>
          <div class="tarjeta-modelo">
            <img src="Imagenes/vienna.avif" alt="Modelo 3">
            <p>Austria Vienna</p>
          </div>
          <div class="tarjeta-modelo">
            <img src="Imagenes/romaLB.jpg" alt="Italia Roma">
            <p>Italia Roma</p>
          </div>
        </div>

      </article>
    </section>
  </main>

  <footer>
    <p> @christianlouboutin</p>
  </footer>
</body>
</html>
